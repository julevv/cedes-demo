<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CeDes prototype: understand a cease-and-desist letter about a trade mark. General information only, not legal advice.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231F5BA8%22/%3E%3Cpath%20d%3D%22M19%2012H38L48%2022V43a3%203%200%200%201-3%203H31.5L23%2053.5V46H19a3%203%200%200%201-3-3V15a3%203%200%200%201%203-3Z%22%20fill%3D%22%23FFFFFF%22/%3E%3Cpath%20d%3D%22M38%2012V19a3%203%200%200%200%203%203H48Z%22%20fill%3D%22%23BFD3EE%22/%3E%3Crect%20x%3D%2221.5%22%20y%3D%2225%22%20width%3D%2217%22%20height%3D%223.6%22%20rx%3D%221.8%22%20fill%3D%22%231F5BA8%22/%3E%3Crect%20x%3D%2221.5%22%20y%3D%2231.2%22%20width%3D%2221%22%20height%3D%223.6%22%20rx%3D%221.8%22%20fill%3D%22%23F5A524%22/%3E%3Crect%20x%3D%2221.5%22%20y%3D%2237.4%22%20width%3D%2211%22%20height%3D%223.6%22%20rx%3D%221.8%22%20fill%3D%22%231F5BA8%22/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>CeDes Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: government-style service page. Desktop = chat column + sticky "Your case" panel; phone = one column with a collapsible case bar. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --fg:#16202C; --muted:#4D5967; --line:#D3D9E1;
  --action:#1F5BA8; --action-fg:#FFFFFF; --action-soft:#EAF1FA; --action-ink:#123A6B;
  --crit:#B42318; --crit-bg:#FEF3F2; --crit-ink:#7A1A12;
  --warn:#B54708; --warn-bg:#FFF6DB; --warn-ink:#6B3A07;
  --ok:#067647; --ok-bg:#ECFDF3; --ok-ink:#054F31;
  --agent-bg:#EEF1F5; --user-bg:#1E2A3A; --user-fg:#FFFFFF; --focus:#F5A524;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-zh:'Public Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161F29; --fg:#E6EBF1; --muted:#A5B1BF; --line:#2B3746;
  --action:#6EA8F0; --action-fg:#0A1A2C; --action-soft:#15304F; --action-ink:#C3DAF8;
  --crit:#F97066; --crit-bg:#3A1513; --crit-ink:#FDD8D3;
  --warn:#F5A524; --warn-bg:#33240B; --warn-ink:#FBE3B3;
  --ok:#47CD89; --ok-bg:#0E2B1D; --ok-ink:#BDF0D4;
  --agent-bg:#1F2935; --user-bg:#2E4A70; --user-fg:#FFFFFF; --focus:#F5A524;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161F29; --fg:#E6EBF1; --muted:#A5B1BF; --line:#2B3746;
  --action:#6EA8F0; --action-fg:#0A1A2C; --action-soft:#15304F; --action-ink:#C3DAF8;
  --crit:#F97066; --crit-bg:#3A1513; --crit-ink:#FDD8D3;
  --warn:#F5A524; --warn-bg:#33240B; --warn-ink:#FBE3B3;
  --ok:#47CD89; --ok-bg:#0E2B1D; --ok-ink:#BDF0D4;
  --agent-bg:#1F2935; --user-bg:#2E4A70; --user-fg:#FFFFFF; --focus:#F5A524;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5}
:root[lang="zh-Hans"] body{font-family:var(--font-zh)}
.app{height:100%;display:flex;flex-direction:column}
a{color:var(--action)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{background:var(--surface);border-top:4px solid var(--action);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar-in{max-width:1240px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;flex-shrink:0;display:block}
.cd{color:var(--action)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand > span{font-size:13px;color:var(--muted)}
.tag{font:600 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn)}
.tools{display:flex;gap:8px;align-items:center}
.langsel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 8px;min-height:40px;background:var(--surface)}
.langsel select{border:0;background:transparent;min-height:38px;font-size:14px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--fg);background:var(--surface);color:var(--fg);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--agent-bg)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--action-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;border-width:1px;border-color:var(--line)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* layout */
.layout{flex:1;min-height:0;width:100%;max-width:1240px;margin:0 auto;padding-block:20px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}
.chat{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.log{flex:1;min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.composer{border-top:1px solid var(--line);padding:14px 24px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.composer .row{display:flex;flex-wrap:wrap;gap:8px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.panel{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.casebar{display:none}

/* messages */
.msg{max-width:min(600px,90%);padding:11px 15px;font-size:15.5px;line-height:1.55;overflow-wrap:anywhere}
.agent{align-self:flex-start;background:var(--agent-bg);border-radius:4px 16px 16px 16px}
.user{align-self:flex-end;background:var(--user-bg);color:var(--user-fg);border-radius:16px 4px 16px 16px}
.user .thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.user .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid rgba(255,255,255,.4)}
.who{font:600 11px/1 var(--font-mono);letter-spacing:.06em;color:var(--muted);margin:6px 0 -6px 2px}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:var(--agent-bg);border-radius:4px 16px 16px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}.log{scroll-behavior:auto}}

/* cards */
.card{align-self:stretch;max-width:680px;width:100%;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.card p{margin:0}
.card.crit{border:2px solid var(--crit);background:var(--crit-bg)}
.card.warn{border:2px solid var(--warn);background:var(--warn-bg)}
.card.info{border-color:var(--action);background:var(--action-soft)}
.eyebrow{font:600 11px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.crit .eyebrow,.crit h3{color:var(--crit-ink)}
.warn .eyebrow{color:var(--warn-ink)}
.info h3,.info .eyebrow{color:var(--action-ink)}
.note{font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:10px 16px;margin:0}
.facts dt{font:600 11px/1.4 var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.facts dd{margin:0;font-size:15px}
.facts dd .orig{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.facts .hot{color:var(--crit-ink);font-weight:700}
.facts .hotrow{background:var(--crit-bg);border-radius:6px;padding:4px 8px;margin:-4px -8px}
.facts ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.editgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.field input,.field textarea{font-weight:400;font-size:15px;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;min-height:44px;padding:8px 10px;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--action);outline:none;box-shadow:0 0 0 3px var(--action-soft)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px;border:2px dashed var(--action);border-radius:12px;background:var(--action-soft);color:var(--action-ink);cursor:pointer;text-align:center}
.drop:hover,.drop.over{filter:brightness(.97)}
.drop b{font-size:16px}
.drop span{font-size:13px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks .t{display:flex;flex-direction:column;min-width:0}
.checks .t b{font-size:15px}
.checks .t span{font-size:13px;color:var(--muted)}
.dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;margin-top:1px}
.dot.done{background:var(--ok)}
.dot.working{border:2.5px solid var(--action);border-right-color:transparent;animation:spin .8s linear infinite}
.dot.todo{border:2px solid var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dot.working{animation:none;border-right-color:var(--action)}}
.bar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.bar i{height:6px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--ok)}
.finding{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.chip{align-self:flex-start;font:600 11px/1 var(--font-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:4px;border:1.5px solid}
.chip.diff{color:var(--ok-ink);background:var(--ok-bg);border-color:var(--ok)}
.chip.sim{color:var(--warn-ink);background:var(--warn-bg);border-color:var(--warn)}
.chip.check{color:var(--action-ink);background:var(--action-soft);border-color:var(--action);border-style:dashed}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fgrid div{display:flex;flex-direction:column;gap:2px;font-size:14px}
.fgrid div b,.why b,.ask b{font:600 10.5px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.why{font-size:14px;display:flex;flex-direction:column;gap:2px}
.ask{font-size:14px;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--action-soft);color:var(--fg)}
.ask b{color:var(--action-ink)}
.opts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.att{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.att-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.att-h b{font-size:16px}
.att-h span{font:600 12px/1 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.att dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:4px 10px;margin:0;font-size:14px}
.att dt{color:var(--muted)}
.att dd{margin:0}
.sample{font:600 10px/1 var(--font-mono);letter-spacing:.06em;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn);border-radius:3px;padding:2px 5px;margin-left:6px;vertical-align:2px}
.gate{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.gate input{width:22px;height:22px;margin-top:1px;flex-shrink:0;accent-color:var(--action)}
.links{display:flex;flex-direction:column;gap:8px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--action-ink);font-weight:600;font-size:15px;text-decoration:none}
.links a:hover{border-color:var(--action)}
.tbanner{border:2px solid var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.tbanner .eyebrow{color:var(--warn-ink)}

/* panel */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard h2{margin:0;font-size:15px;font-weight:700}
.dl{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.dl.hot{background:var(--crit-bg);border:2px solid var(--crit)}
.dl.calm{background:var(--action-soft);border:1px solid var(--action)}
.dl .big{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.dl.hot .big,.dl.hot .eyebrow{color:var(--crit-ink)}
.dl.calm .big,.dl.calm .eyebrow{color:var(--action-ink)}
.dl span{font-size:13px}
.kv{display:flex;flex-direction:column;gap:8px;margin:0}
.kv div{display:flex;flex-direction:column}
.kv dt{font:600 10.5px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-size:14.5px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted)}
.steps li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;font:600 11px/1 var(--font-mono);font-style:normal}
.steps li.done{color:var(--fg)}
.steps li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.now{color:var(--fg);font-weight:700}
.steps li.now i{border-color:var(--action);color:var(--action-ink)}
.pnote{background:var(--warn-bg);border:1.5px solid var(--warn);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.pnote b{color:var(--warn-ink)}
.plinks{display:flex;flex-direction:column;gap:6px;font-size:14px}

/* phone */
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:0;gap:0}
  .panel{display:none}
  .chat{border-radius:0;border-left:0;border-right:0;border-top:0}
  .log,.composer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .log{padding-block:16px}
  .casebar{display:block;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
  .casebar summary{cursor:pointer;min-height:48px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;list-style:none}
  .casebar summary::-webkit-details-marker{display:none}
  .casebar summary .chev{margin-left:auto;transition:transform .2s}
  .casebar[open] summary .chev{transform:rotate(180deg)}
  .casebar .inner{display:flex;flex-direction:column;gap:12px;padding-bottom:14px;max-height:55vh;overflow-y:auto}
  .brand > span{display:none}
  .facts{grid-template-columns:1fr;gap:2px}
  .facts dd{margin-bottom:10px}
  .fgrid,.editgrid{grid-template-columns:1fr}
  .composer .row .btn{flex:1 1 auto}
}
@media (max-width:420px){ .langsel .lbl{display:none} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-in gutter">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1F5BA8"/><path d="M19 12H38L48 22V43a3 3 0 0 1-3 3H31.5L23 53.5V46H19a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3Z" fill="#FFFFFF"/><path d="M38 12V19a3 3 0 0 0 3 3H48Z" fill="#BFD3EE"/><rect x="21.5" y="25" width="17" height="3.6" rx="1.8" fill="#1F5BA8"/><rect x="21.5" y="31.2" width="21" height="3.6" rx="1.8" fill="#F5A524"/><rect x="21.5" y="37.4" width="11" height="3.6" rx="1.8" fill="#1F5BA8"/></svg>
      <div class="brand">
        <b><span id="t-name"><span class="cd">C</span>e<span class="cd">D</span>es</span><span class="tag" id="t-proto">Prototype</span></b>
        <span id="t-sub">Cease-and-desist letter helper</span>
      </div>
      <div class="tools">
        <label class="langsel" for="lang">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9s1.3-6.5 3.8-9z"/></svg>
          <span class="sr" id="t-lang">Language</span>
          <select id="lang">
            <option value="en">English</option>
            <option value="zh">简体中文</option>
            <option disabled>Tiếng Việt (coming soon)</option>
            <option disabled>العربية (coming soon)</option>
            <option disabled>हिन्दी (coming soon)</option>
            <option disabled>Ελληνικά (coming soon)</option>
          </select>
        </label>
        <button type="button" class="btn small" id="restart">Start again</button>
      </div>
    </div>
  </header>
  <details class="casebar gutter" id="casebar"><summary><span id="cb-title">Your case</span><span id="cb-chip"></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="inner" id="cb-inner"></div></details>
  <div class="layout gutter">
    <section class="chat" aria-label="Conversation">
      <div class="log" id="log" role="log" aria-live="polite"></div>
      <div class="composer" id="composer"></div>
    </section>
    <aside class="panel" id="panel" aria-label="Your case"></aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script>
/* CeDes letter reader: rule-based stand-in for the language model step. */
const TZ = {
  AWST: { off: 8, zone: 'Australia/Perth', en: 'Perth time', zh: '西澳时间' },
  ACST: { off: 9.5, zone: 'Australia/Darwin', en: 'Darwin time', zh: '北领地时间' },
  ACDT: { off: 10.5, zone: 'Australia/Adelaide', en: 'Adelaide time', zh: '南澳时间' },
  AEST: { off: 10, zone: 'Australia/Brisbane', en: 'Brisbane time', zh: '东部标准时间' },
  AEDT: { off: 11, zone: 'Australia/Sydney', en: 'Sydney and Melbourne time', zh: '东部夏令时间' }
};
const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const STATES = { 'New South Wales': 'NSW', 'Victoria': 'VIC', 'Queensland': 'QLD', 'Western Australia': 'WA', 'South Australia': 'SA', 'Tasmania': 'TAS', 'Australian Capital Territory': 'ACT', 'Northern Territory': 'NT' };

function parseDeadline(str) {
  if (!str) return null;
  const m = str.match(/(\d{1,2})[.:](\d{2})\s*(am|pm)\s*\(?\s*(A[WCE][SD]T)?\s*\)?[^\d]*?(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/i);
  if (!m) return null;
  let h = +m[1] % 12; if (m[3].toLowerCase() === 'pm') h += 12;
  const mon = MONTHS.indexOf(m[6].toLowerCase());
  if (mon < 0) return null;
  const tz = TZ[(m[4] || 'AEDT').toUpperCase()] ? (m[4] || 'AEDT').toUpperCase() : 'AEDT';
  const ms = Date.UTC(+m[7], mon, +m[5], h, +m[2]) - TZ[tz].off * 3600000;
  return { ms, tz, text: str.trim() };
}

function lev(a, b) {
  a = a.toUpperCase(); b = b.toUpperCase();
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

function parseLetter(raw) {
  const text = raw.replace(/\r/g, '').replace(/[‘’]/g, "'");
  const flat = text.replace(/\s+/g, ' ');
  const paras = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const out = {};
  const firm = flat.match(/\b([A-Z][A-Za-z&' ]*?(?:LAWYERS|Lawyers|LEGAL|Legal|SOLICITORS|Solicitors)(?: PTY LTD| Pty Ltd)?)\b/);
  if (firm) out.sender = firm[1].replace(/\b([A-Z])([A-Z]+)\b/g, (w, a, b) => a + b.toLowerCase()).replace(/\bPty Ltd\b/i, 'Pty Ltd');
  const areasLine = paras.slice(0, 4).find(p => p.includes('|'));
  if (areasLine) out.areas = areasLine.split('|').map(s => s.trim()).filter(Boolean);
  const office = flat.match(/,\s*([A-Z][A-Za-z ]+?)\s+(WA|NSW|VIC|QLD|SA|TAS|ACT|NT)\s+\d{4}/);
  if (office) out.office = office[1].trim() + ' ' + office[2];
  const date = paras.find(p => /^\d{1,2} [A-Z][a-z]+ \d{4}$/.test(p));
  if (date) out.letterDate = date;
  const client = flat.match(/We act for (.+?)\s*\(ACN ([\d ]+)\)/i);
  if (client) { out.client = client[1].trim(); out.acn = client[2].trim(); }
  const base = flat.match(/based in ([A-Z][A-Za-z ]+),\s*(New South Wales|Victoria|Queensland|Western Australia|South Australia|Tasmania|Australian Capital Territory|Northern Territory)/);
  if (base) out.clientBase = base[1].trim() + ' ' + STATES[base[2]];
  const prods = flat.match(/manufacturer and distributor of ([^,]+(?:, [^,]+)*? (?:and )?[^,]+?), based/i);
  if (prods) out.clientProducts = prods[1].trim();
  const reg = flat.match(/Registration No\.?\s*(\d{6,7})\s*(?:for the word mark|\()\s*([A-Z][A-Z]+)/);
  if (reg) { out.number = reg[1]; out.mark = reg[2]; }
  const cls = flat.match(/class (\d{1,2}) in respect of\s*["“]([^"”]+)["”]/i);
  if (cls) { out.cls = cls[1]; out.goods = cls[2].trim(); }
  const sign = flat.match(/using the sign ([A-Z][A-Z]+)/);
  if (sign) out.sign = sign[1];
  const conn = flat.match(/in connection with ([^.]+?)\./i);
  if (conn) out.yourGoods = conn[1].trim();
  out.claimsSubstantially = /substantially identical/i.test(flat);
  out.claimsDeceptively = /deceptively similar/i.test(flat);
  const laws = [];
  const tm = [...flat.matchAll(/section (\d+(?:\(\d+\))?) of (?:the )?(Trade Marks Act 1995|Act)\b/gi)].map(m => m[1]);
  if (tm.length) laws.push({ act: 'tm', secs: [...new Set(tm)] });
  if (/section 18 of the Australian Consumer Law/i.test(flat)) laws.push({ act: 'acl', secs: ['18'] });
  out.laws = laws;
  const iStart = paras.findIndex(p => /requires that you:?$/i.test(p));
  const iEnd = paras.findIndex((p, i) => i > iStart && /^We require/i.test(p));
  if (iStart >= 0 && iEnd > iStart) out.demands = paras.slice(iStart + 1, iEnd).map(s => s.replace(/;\s*(and)?$/, '').replace(/\.$/, ''));
  const dl = flat.match(/by\s+(\d{1,2}[.:]\d{2}\s*[ap]m\s*\([A-Z]{4}\)\s*on\s*[A-Za-z]+,?\s*\d{1,2}\s+[A-Za-z]+\s+\d{4})/i);
  if (dl) out.deadline = parseDeadline(dl[1]);
  const court = flat.match(/proceedings against you in the ([A-Z][A-Za-z ]+?Court(?: of Australia)?)/);
  if (court) out.court = court[1];
  out.threatensCourt = /commence proceedings|legal proceedings|court/i.test(flat);
  out.undertaking = /undertaking/i.test(flat);
  out.ok = !!(out.mark && out.sign);
  if (out.mark && out.sign) out.distance = lev(out.mark, out.sign);
  return out;
}

  else if (/remove/i.test(en)) z = (days ? '自信件日期起 ' + days + ' 天内，' : '') + '从所有产品、包装、招牌、网站和社交媒体中移除 ' + sign + ' 标志';
  else if (/deliver up|destroy/i.test(en)) z = '交出或销毁所有带有 ' + sign + ' 标志的库存和材料，并提供销毁证明';
  else if (/account of/i.test(en)) z = '提供自开始使用以来所有带有 ' + sign + ' 标志的产品的销售记录';
  else if (/undertaking/i.test(en)) z = '签署并交回随附的承诺书（undertaking）';
  return z ? esc(z) + '<span class="orig">' + esc(en) + '</span>' : esc(en);
}

/* ---------- composer ---------- */
function composerHtml(){
  if (S.busy) return '<div class="row"><span class="note">…</span></div>';
  const b = (act, k, cls) => '<button type="button" class="btn ' + (cls || '') + '" data-act="' + act + '">' + t(k) + '</button>';
  switch (S.step){
    case 'welcome': return '<div class="row">' + b('received', 'optReceived', 'primary') + b('learn', 'optLearn') + b('send', 'optSend') + '</div>';
    case 'learnQ': return '<div class="row">' + b('received', 'yesLetter', 'primary') + b('notNow', 'notNow') + '</div>';
    case 'upload': return '<label class="drop" id="drop" for="letter-file"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><b>' + t('dropT') + '</b><span>' + t('dropH') + '</span><input id="letter-file" type="file" accept=".docx,.txt,.pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,application/pdf" class="sr"></label>' +
      '<div class="row">' + b('demo', 'useDemo') + b('manual', 'cantUpload') + '</div>';
    case 'manual': return '<form id="manual-form" class="editgrid">' +
      ['sender:fSender','client:fClient','mark:fMark','number:fNumber','sign:fSign'].map(x => { const [id, k] = x.split(':'); return '<label class="field" for="m-' + id + '">' + t(k) + '<input id="m-' + id + '" required></label>'; }).join('') +
      '<label class="field" for="m-deadline">' + t('fDeadline') + '<input id="m-deadline" type="date"></label><div style="grid-column:1/-1"><button class="btn primary" type="submit">' + t('fCont') + '</button></div></form>';
    case 'urgent': return '<div class="row">' + b('findNow', 'findNow', 'primary') + b('toSummary', 'toSummary') + '</div>';
    case 'summaryQ': return S.editing ? '' : '<div class="row">' + b('yesCheck', 'yesCheck', 'primary') + b('noCheck', 'noThanks') + '</div>';
    case 'use': return '<form id="use-form" style="display:flex;flex-direction:column;gap:10px"><label class="field" for="sells">' + t('sellL') + '<input id="sells" placeholder="' + esc(t('sellP')) + '" value="' + esc(S.sellsDraft ?? '') + '"></label>' +
      '<label class="field" for="photos">' + t('photosL') + '<input id="photos" type="file" accept="image/*" multiple style="min-height:auto;padding:8px"></label><div><button class="btn primary" type="submit">' + t('startCheck') + '</button></div></form>';
    case 'gate': return '<label class="gate" for="ack"><input type="checkbox" id="ack"><span>' + t('gateCheck') + '</span></label><div class="row"><button type="button" class="btn primary" data-act="gate" id="gate-btn" disabled>' + t('gateBtn') + '</button></div>';
    case 'attQ': return '<div class="row">' + b('yesFind', 'yesFind', 'primary') + b('noFind', 'noThanks') + '</div>';
    case 'postcode': return '<form id="pc-form" style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap"><label class="field" for="pc" style="flex:1 1 160px">' + t('pcL') + '<input id="pc" inputmode="numeric" maxlength="4" placeholder="' + t('pcP') + '" autocomplete="postal-code"></label><button class="btn primary" type="submit">' + t('search') + '</button><p class="note" id="pc-err" style="width:100%;margin:0;color:var(--crit-ink)" hidden>' + t('pcErr') + '</p></form>';
    case 'attDone': return '<div class="row">' + b('next', 'showNext', 'primary') + (S.seenSummary ? '' : b('toSummary', 'backSummary')) + '</div>';
    case 'next': case 'end': return '<div class="row">' + b('restart', 'restart') + '</div>';
  }
  return '';
}

/* ---------- panel ---------- */
function panelHtml(){
  const d = S.data, n = daysLeft();
  let h = '';
  if (d && d.deadline){
    const hot = n <= 14;
    h += '<div class="dl ' + (hot ? 'hot' : 'calm') + '"><span class="eyebrow">' + (n < 0 ? t('passed') : n === 0 ? t('today') : t('replyIn')) + '</span>' + (n > 0 ? '<span class="big">' + t('days')(n) + '</span>' : '') + '<span>' + t('by') + ' ' + esc(deadlineText()) + '</span></div>';
  }
  if (d){
    const kv = (k, v) => v ? '<div><dt>' + t(k) + '</dt><dd>' + esc(v) + '</dd></div>' : '';
    h += '<dl class="kv">' + kv('kSender', d.sender) + kv('kClient', d.client) + kv('kMark', d.mark ? d.mark + (d.number ? ' (' + d.number + ')' : '') : '') + kv('kSign', d.sign) + '</dl>';
  } else h += '<p class="note" style="margin:0">' + t('caseEmpty') + '</p>';
  const steps = t('steps');
  h += '<ol class="steps">' + steps.map((s, i) => { const st = S.progress > i + 1 ? 'done' : S.progress === i + 1 ? 'now' : ''; return '<li class="' + st + '"><i>' + (st === 'done' ? '✓' : i + 1) + '</i>' + esc(s) + '</li>'; }).join('') + '</ol>';
  return h;
}
function panelFull(){
  return '<div class="pcard"><h2>' + t('caseTitle') + '</h2>' + panelHtml() + '</div>' +
    '<div class="pnote"><b>' + t('noticeT') + '</b><span>' + t('noticeB') + '</span></div>' +
    '<div class="pcard"><h2>' + t('helpT') + '</h2><div class="plinks"><a href="' + LINKS.firstResponse + '" target="_blank" rel="noopener">' + t('lFirst') + '</a><a href="' + LINKS.scams + '" target="_blank" rel="noopener">' + t('lScams') + '</a><a href="' + LINKS.engage + '" target="_blank" rel="noopener">' + t('lEngage') + '</a></div></div>' +
    '<p class="foot" style="margin:0">' + t('foot') + '</p>';
}

/* ---------- render ---------- */
let lastLen = 0;
function render(){
  document.documentElement.lang = S.lang === 'zh' ? 'zh-Hans' : 'en-AU';
  $('t-proto').textContent = t('proto'); $('t-sub').textContent = t('sub'); $('t-lang').textContent = t('lang'); $('restart').textContent = t('restart');
  $('lang').value = S.lang;
  const log = $('log');
  let html = '';
  if (S.lang === 'zh') html += '<div class="tbanner" role="note"><span class="eyebrow">' + t('tBannerT') + '</span><span>' + t('tBannerB') + '</span></div>';
  let prev = null;
  for (const e of S.log){
    const who = e.who === 'user' ? 'user' : 'agent';
    if (who !== prev && e.who !== 'card' && !e.small) html += '<div class="who" style="align-self:' + (who === 'user' ? 'flex-end' : 'flex-start') + '">' + (who === 'user' ? t('you') : t('bot')) + '</div>';
    prev = e.who === 'card' ? prev : who;
    html += renderMsg(e);
  }
  if (S.busy) html += '<div class="typing" aria-label="CeDes is typing"><i></i><i></i><i></i></div>';
  log.innerHTML = html;
  if (S.log.length !== lastLen || S.busy){ log.scrollTop = log.scrollHeight; lastLen = S.log.length; }
  const comp = $('composer');
  const focusId = document.activeElement && comp.contains(document.activeElement) ? document.activeElement.id : null;
  if (comp.dataset.step !== S.step + '|' + S.busy + '|' + S.lang + '|' + S.editing){
    comp.innerHTML = composerHtml() + '<p class="foot" style="margin:0">' + t('foot') + '</p>';
    comp.dataset.step = S.step + '|' + S.busy + '|' + S.lang + '|' + S.editing;
    wireComposer();
    if (focusId && $(focusId)) $(focusId).focus();
  }
  $('panel').innerHTML = panelFull();
  $('cb-title').textContent = t('caseTitle');
  const n = daysLeft();
  $('cb-chip').innerHTML = n == null ? '' : '<span class="chip ' + (n <= 14 ? 'sim' : 'check') + '" style="' + (n <= 14 ? 'color:var(--crit-ink);background:var(--crit-bg);border-color:var(--crit)' : '') + '">' + esc(n < 0 ? t('passed') : n === 0 ? t('today') : t('replyIn') + ' ' + t('days')(n)) + '</span>';
  $('cb-inner').innerHTML = panelHtml() + '<div class="pnote"><b>' + t('noticeT') + '</b><span>' + t('noticeB') + '</span></div>';
}

/* ---------- flow ---------- */
async function start(){
  S.log = []; S.data = null; S.sells = ''; S.sellsDraft = undefined; S.photos = []; S.research = []; S.seenSummary = false; S.editing = false; S.progress = 0;
  S.step = 'welcome';
  await say({ k:'welcome1' }, { k:'welcome2' }, { k:'welcomeQ' });
}
async function goUpload(){ setProgress(1); await say({ k:'uploadAsk' }, { k:'privacy', small:true }); S.step = 'upload'; render(); }
async function processText(text){
  S.step = 'reading';
  S.busy = true; render();
  await sleep(500); S.log.push({ who:'agent', k:'reading' }); render();
  await sleep(1300);
  const d = parseLetter(text);
  S.busy = false;
  if (!d.ok){ S.step = 'upload'; await say({ k:'readFail' }); render(); return; }
  S.data = d;
  S.sellsDraft = d.yourGoods ? d.yourGoods.replace(/,? and related products/i, '').replace(/, (\w+)$/, ' and $1') : '';
  afterRead();
}
async function afterRead(){
  setProgress(2);
  const n = daysLeft();
  if ((n != null && n <= 14) || S.data.court){
    await say({ k:'urgentLead' }, { who:'card', kind:'urgent' });
    S.step = 'urgent'; render();
  } else showSummary();
}
async function showSummary(){
  S.seenSummary = true; setProgress(2);
  await say({ k:'summaryLead' }, { who:'card', kind:'summary' }, { k:'summaryQ' });
  S.step = 'summaryQ'; render();
}
async function research(){
  setProgress(3);
  S.research = ['todo','todo','todo','todo','todo','todo'];
  await say({ k:'researchLead' }, { who:'card', kind:'research' });
  S.step = 'researching'; S.busy = true; render();
  for (let i = 0; i < 6; i++){ S.research[i] = 'working'; render(); await sleep(750); S.research[i] = 'done'; render(); }
  S.busy = false;
  await say({ k:'researchDone' }, { who:'card', kind:'gate' });
  S.step = 'gate'; render();
}
async function showFindings(){
  setProgress(4);
  me('gateDone');
  await say({ who:'card', kind:'findings' }, { who:'card', kind:'options' }, { k:'attQ' });
  S.step = 'attQ'; render();
}
async function askPostcode(){ setProgress(5); await say({ k:'pcAsk' }); S.step = 'postcode'; render(); }
async function findAtt(pc){
  const place = PLACES[pc] || (S.lang === 'zh' ? pc + ' 地区' : 'the ' + pc + ' area');
  S.place = place;
  me(null, null, { raw: pc });
  await say({ k:'searching', p:{ pc, place: zh(place) } });
  await sleep(900);
  await say({ k:'attLead', p:{ place: zh(place) } }, { who:'card', kind:'attorneys' }, { k:'anything' });
  S.step = 'attDone'; render();
}
async function nextSteps(){ setProgress(5); await say({ k:'nextLead' }, { who:'card', kind:'next' }); S.step = 'next'; render(); }

/* ---------- events ---------- */
function summaryText(){
  const d = S.data; if (!d) return '';
  const L = ['CeDes summary (general information, not legal advice)', ''];
  if (d.sender) L.push('Sent by: ' + d.sender);
  if (d.client) L.push('On behalf of: ' + d.client + (d.clientBase ? ' (' + d.clientBase + ')' : ''));
  if (d.mark) L.push('Their trade mark: ' + d.mark + (d.number ? ', registration no. ' + d.number : '') + (d.cls ? ', class ' + d.cls + ' (' + d.goods + ')' : ''));
  if (d.sign) L.push('What they object to: ' + d.sign);
  if (d.demands) { L.push('What they want:'); d.demands.forEach(x => L.push(' - ' + x)); }
  if (d.deadline) L.push('Reply by: ' + new Intl.DateTimeFormat('en-AU', { timeZone: TZ[d.deadline.tz].zone, weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'numeric', minute:'2-digit' }).format(new Date(d.deadline.ms)) + ' (' + d.deadline.tz + ')');
  if (S.sells) L.push('Our business sells: ' + S.sells);
  L.push('', 'Questions for a professional:', ' - Are our goods "of the same description" as theirs (s 120(2))? Is their mark well known in Australia (s 120(3))?', ' - Is ' + d.sign + ' substantially identical with, or deceptively similar to, ' + d.mark + '?', ' - Are the threats in this letter justified (s 129)?');
  return L.join('\n');
}
async function copyText(txt, btn, doneLabel){
  try { await navigator.clipboard.writeText(txt); btn.textContent = doneLabel; }
  catch(e){ const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); try { document.execCommand('copy'); btn.textContent = doneLabel; } catch(_){} ta.remove(); }
}
async function handleFile(file){
  if (!file) return;
  me('uploaded', { name: file.name });
  const name = file.name.toLowerCase();
  if (name.endsWith('.pdf')){ await say({ k:'pdfMsg' }); S.step = 'upload'; render(); return; }
  try {
    let text = '';
    if (name.endsWith('.docx')){
      if (!window.mammoth) throw new Error('reader not loaded');
      const buf = await file.arrayBuffer();
      text = (await window.mammoth.extractRawText({ arrayBuffer: buf })).value;
    } else text = await file.text();
    processText(text);
  } catch(e){ await say({ k:'readFail' }); S.step = 'upload'; render(); }
}
function wireComposer(){
  const fi = $('letter-file');
  if (fi){
    fi.addEventListener('change', () => handleFile(fi.files[0]));
    const drop = $('drop');
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) handleFile(f); });
  }
  const mf = $('manual-form');
  if (mf) mf.addEventListener('submit', e => {
    e.preventDefault();
    const v = id => $('m-' + id).value.trim();
    const d = { sender: v('sender'), client: v('client'), mark: v('mark').toUpperCase(), number: v('number'), sign: v('sign').toUpperCase(), laws: [], demands: [], ok: true };
    const dd = v('deadline');
    if (dd){ const [y, m, day] = dd.split('-').map(Number); d.deadline = { ms: Date.UTC(y, m - 1, day, 17, 0) - 11 * 3600000, tz: 'AEDT', text: dd }; }
    d.distance = lev(d.mark, d.sign);
    S.data = d; me('manualSent'); afterRead();
  });
  const uf = $('use-form');
  if (uf){
    const ph = $('photos');
    uf.addEventListener('submit', async e => {
      e.preventDefault();
      S.sells = $('sells').value.trim() || S.sellsDraft || '';
      const files = [...(ph.files || [])].slice(0, 6);
      S.photos = await Promise.all(files.map(f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(null); fr.readAsDataURL(f); }))).then(a => a.filter(Boolean));
      me('userSells', { x: zh(S.sells), n: S.photos.length }, { photos: S.photos, k2: S.photos.length ? 'userPhotos' : null });
      research();
    });
  }
  const ack = $('ack');
  if (ack) ack.addEventListener('change', () => { $('gate-btn').disabled = !ack.checked; });
  const pf = $('pc-form');
  if (pf) pf.addEventListener('submit', e => {
    e.preventDefault();
    const pc = $('pc').value.trim();
    if (!/^\d{4}$/.test(pc)){ $('pc-err').hidden = false; $('pc').setAttribute('aria-invalid', 'true'); return; }
    findAtt(pc);
  });
}
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || S.busy) return;
  const a = el.dataset.act;
  if (a === 'received'){ me(S.step === 'learnQ' ? 'yesLetter' : 'optReceived'); goUpload(); }
  else if (a === 'learn'){ me('optLearn'); await say({ k:'learnIntro' }, { who:'card', kind:'learn' }, { k:'learnQ' }); S.step = 'learnQ'; render(); }
  else if (a === 'send'){ me('optSend'); await say({ k:'sendSoon' }, { who:'card', kind:'learn' }, { k:'learnQ' }); S.step = 'learnQ'; render(); }
  else if (a === 'notNow'){ me('notNow'); await say({ k:'endThanks' }); S.step = 'end'; render(); }
  else if (a === 'demo'){ me('useDemo'); processText(DEMO_TEXT); }
  else if (a === 'manual'){ me('cantUpload'); await say({ k:'manualAsk' }); S.step = 'manual'; render(); }
  else if (a === 'findNow'){ me('findNow'); askPostcode(); }
  else if (a === 'toSummary'){ me('toSummary'); showSummary(); }
  else if (a === 'edit'){ S.editing = true; render(); const f = $('e-sender'); if (f) f.focus(); }
  else if (a === 'cancelEdit'){ S.editing = false; render(); }
  else if (a === 'saveEdit'){
    const v = id => $('e-' + id).value.trim();
    Object.assign(S.data, { sender: v('sender'), client: v('client'), mark: v('mark').toUpperCase(), number: v('number'), sign: v('sign').toUpperCase(), cls: v('cls') });
    S.data.distance = lev(S.data.mark, S.data.sign);
    S.editing = false; await say({ k:'saved' });
  }
  else if (a === 'yesCheck'){ me('yesCheck'); setProgress(3); await say({ k:'useAsk' }); S.step = 'use'; render(); }
  else if (a === 'noCheck'){ me('noThanks'); nextSteps(); }
  else if (a === 'gate'){ showFindings(); }
  else if (a === 'yesFind'){ me('yesFind'); askPostcode(); }
  else if (a === 'noFind'){ me('noThanks'); nextSteps(); }
  else if (a === 'next'){ me('showNext'); nextSteps(); }
  else if (a === 'copyAtt'){ const x = ATTS[+el.dataset.i]; copyText(x.name + ', ' + x.firm + '\n' + x.phone + '\n' + x.email, el, t('copied')); }
  else if (a === 'copySum'){ copyText(summaryText(), el, t('copiedSum')); }
  else if (a === 'delete'){ S.data = null; S.photos = []; S.sells = ''; S.progress = 0; S.log = []; await say({ k:'deleted' }, { k:'endThanks' }); S.step = 'end'; render(); }
  else if (a === 'restart'){ start(); }
});
$('restart').addEventListener('click', () => { if (!S.busy) start(); });
$('lang').addEventListener('change', e => { S.lang = e.target.value; try { localStorage.setItem('cedes-lang', S.lang); } catch(_){} render(); });
try { const l = localStorage.getItem('cedes-lang'); if (l === 'zh' || l === 'en') S.lang = l; } catch(_){}
render();
start();
</script>
